<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twin City Go – prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#0B1A33;--surf:#12284F;--surf2:#1A3463;--line:#2B4778;--text:#F4F7FC;--mute:#A9B7D0;
  --blue:#3D8BFF;--blue-ink:#FFFFFF;--green:#2BD67B;--warn:#FFC24B;--danger:#FF6B7A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF2FA;--surf:#FFFFFF;--surf2:#E1E9F6;--line:#C6D3E8;--text:#0B1A33;--mute:#475877;
    --blue:#1C62E0;--blue-ink:#FFFFFF;--green:#0B8F4C;--warn:#8F5B00;--danger:#C1283A;color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF2FA;--surf:#FFFFFF;--surf2:#E1E9F6;--line:#C6D3E8;--text:#0B1A33;--mute:#475877;
  --blue:#1C62E0;--blue-ink:#FFFFFF;--green:#0B8F4C;--warn:#8F5B00;--danger:#C1283A;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1A33;--surf:#12284F;--surf2:#1A3463;--line:#2B4778;--text:#F4F7FC;--mute:#A9B7D0;
  --blue:#3D8BFF;--blue-ink:#FFFFFF;--green:#2BD67B;--warn:#FFC24B;--danger:#FF6B7A;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
i[data-lucide],svg.lucide{width:18px;height:18px;flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font:800 20px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:34px;height:20px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs a{padding:8px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:700;font-size:15px}
.tabs a[aria-current="page"]{color:var(--text);background:var(--surf2)}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);padding:0 38px 0 40px;outline:none}
.search input:focus{border-color:var(--blue)}
.search .s-ico{position:absolute;left:12px;top:12px;color:var(--mute)}
.search .clear{position:absolute;right:6px;top:6px;border:0;background:none;width:30px;height:30px;color:var(--mute);display:none;align-items:center;justify-content:center}
.search.has .clear{display:flex}
.sugg{position:absolute;left:0;right:0;top:48px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;max-height:60vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.sugg.on{display:block}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.sugg button:hover,.sugg button.hl{background:var(--surf2)}
.sugg small{color:var(--mute);margin-left:auto;white-space:nowrap}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.pop{position:absolute;right:0;top:50px;width:min(320px,90vw);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:none;z-index:30;text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.pop.on{display:block}
.pop p{margin:0 0 10px;font-size:14px}
.pop p:last-child{margin:0}
.wrapRel{position:relative}

/* layout */
main{max-width:1280px;margin:0 auto;padding:16px 16px 110px}
.notice{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--warn);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.notice i{color:var(--warn);margin-top:2px}
.notice button{margin-left:auto;border:0;background:none;color:var(--mute);padding:2px}
.place-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin:4px 0 14px}
.place-head h1{font:800 clamp(30px,6vw,56px)/.95 var(--display);letter-spacing:-.035em;margin:0}
.place-head h1 .near{display:block;font-size:.42em;font-weight:600;color:var(--mute);letter-spacing:-.01em;margin-bottom:6px}
.anchorpick{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:0 4px 0 10px;height:40px}
.anchorpick select{border:0;background:transparent;height:38px;font-weight:700;padding-right:4px;max-width:58vw}
.unv{font-size:13px;color:var(--warn);display:flex;gap:6px;align-items:center}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.toolbar label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.toolbar select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surf);padding:0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surf);margin-left:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;display:flex;gap:6px;align-items:center;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:700;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chips.sub .chip{height:32px;font-size:14px;font-weight:400;background:transparent}
.chips.sub .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
.resultline{font-size:14px;color:var(--mute);margin:6px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtag{display:inline-flex;gap:4px;align-items:center;background:var(--surf2);color:var(--text);border-radius:999px;padding:2px 4px 2px 10px}
.qtag button{border:0;background:none;padding:2px;display:flex;color:var(--mute)}

/* feed */
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.feed{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1100px){.feed{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--c)}
.art{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--c) 16%,var(--surf2));overflow:hidden}
.art svg.radar{position:absolute;inset:0;width:100%;height:100%}
.art .ico{position:absolute;left:10px;top:10px;width:34px;height:34px;border-radius:10px;background:var(--c);color:#0B1A33;display:flex;align-items:center;justify-content:center}
.art .dist{position:absolute;left:12px;bottom:8px;font:800 clamp(22px,4.6vw,34px)/1 var(--display);letter-spacing:-.03em;color:var(--text)}
.art .dist small{font-size:.45em;font-weight:600;color:var(--mute);display:block;letter-spacing:0;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.demo{color:var(--warn)}
.badge.real{color:var(--green)}
.badge.st{color:var(--mute)}
.badge.rep{color:var(--danger)}
.art .badge{position:absolute;right:10px;top:12px;background:var(--bg)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cbody h3{margin:0;font:700 17px/1.2 var(--display);letter-spacing:-.01em}
.meta{margin:0;font-size:13px;color:var(--mute)}
.desc{margin:2px 0 0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.openst{font-size:13px;font-weight:700}
.openst.y{color:var(--green)}.openst.n{color:var(--danger)}.openst.u{color:var(--mute);font-weight:400}
.save{margin-left:auto;border:0;background:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.save[aria-pressed="true"]{color:var(--danger)}
.save[aria-pressed="true"] svg{fill:currentColor}
@media (max-width:480px){.desc{display:none}.cbody h3{font-size:15px}.cbody{padding:8px 10px 10px}}
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--mute)}
.empty p{margin:0 0 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:700;text-decoration:none;color:var(--text)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}

/* map */
.mapwrap{display:grid;gap:14px}
@media (min-width:960px){.mapwrap{grid-template-columns:minmax(0,1fr) 340px}}
.mapbox{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:72vh}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapnote{font-size:13px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line)}
.mk{cursor:pointer}
.mk:focus-visible circle{stroke:var(--blue);stroke-width:4}
.side{display:flex;flex-direction:column;gap:12px}
.mini{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}
.mini h3{margin:0 0 4px;font:700 18px/1.2 var(--display)}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;color:var(--mute)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i.sw{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,8,20,.6);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;z-index:41;background:var(--bg);border-left:1px solid var(--line);top:0;right:0;bottom:0;width:min(540px,100%);overflow:auto;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
@media (max-width:719px){.sheet{top:auto;left:0;width:100%;height:92%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .hero{aspect-ratio:16/9;border-radius:0}
.sheet .x{position:absolute;top:12px;right:12px;z-index:2;background:var(--bg)}
.sheet .inner{padding:16px 18px}
.sheet h2{font:800 30px/1.05 var(--display);letter-spacing:-.03em;margin:10px 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.actions .pri{grid-column:1/-1}
dl.info{margin:0;display:grid;grid-template-columns:120px 1fr;gap:10px 14px;font-size:15px}
dl.info dt{color:var(--mute)}
dl.info dd{margin:0}
.nv{color:var(--mute)}
.attr-note{font-size:13px;color:var(--mute);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.formbox{display:grid;gap:10px;margin-top:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px}
.formbox label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.formbox select,.formbox input,.formbox textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;color:var(--text)}
h4.sec{font:700 18px/1.2 var(--display);margin:22px 0 10px}

/* transport */
.tgrid{display:grid;gap:16px}
@media (min-width:960px){.tgrid{grid-template-columns:360px minmax(0,1fr)}}
.stoplist{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:10px 12px;width:100%}
.stop[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.stop .b{width:38px;height:38px;border-radius:10px;background:#2F7BFF;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.stop strong{display:block;font-size:15px}
.stop small{color:var(--mute);font-size:13px}
.stop .d{margin-left:auto;font:800 18px/1 var(--display);white-space:nowrap}
table.dep{width:100%;border-collapse:collapse;font-size:15px}
table.dep th{text-align:left;color:var(--mute);font-weight:400;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.dep td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.rcode{display:inline-block;font:800 14px/1 var(--display);background:var(--blue);color:var(--blue-ink);padding:5px 8px;border-radius:7px}
.big{font:800 26px/1 var(--display);letter-spacing:-.02em}
.seq{list-style:none;margin:0;padding:0;position:relative}
.seq li{position:relative;padding:0 0 16px 30px}
.seq li::before{content:"";position:absolute;left:8px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--blue)}
.seq li::after{content:"";position:absolute;left:13px;top:20px;bottom:0;width:2px;background:var(--line)}
.seq li:last-child::after{display:none}
.seq li.here::before{background:var(--green);border-color:var(--green)}
.seq button{border:0;background:none;padding:0;font-weight:700;text-align:left}
.seq small{color:var(--mute);margin-left:6px}
.routes{display:flex;flex-direction:column;gap:8px}
.routebtn{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.routebtn[aria-pressed="true"]{border-color:var(--blue)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--surf2);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--mute);font-size:12px}

/* admin/profile */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.panel h2{font:800 24px/1.1 var(--display);margin:0 0 12px;letter-spacing:-.02em}
table.adm{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.adm th,table.adm td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.adm th{color:var(--mute);font-weight:400}
table.adm select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.field input,.field select{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;color:var(--text)}
h1.pg{font:800 clamp(30px,5vw,48px)/1 var(--display);letter-spacing:-.035em;margin:6px 0 16px}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom div{display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:700}
nav.bottom a[aria-current="page"]{color:var(--blue)}
@media (max-width:759px){nav.bottom{display:block}.tabs{display:none}.bar{flex-wrap:wrap}.search{order:5;flex-basis:100%}.logo .tag{display:none}.hide-sm{display:none}}
.tag{font:400 13px/1 var(--body);color:var(--mute);letter-spacing:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
footer.f{max-width:1280px;margin:0 auto;padding:0 16px 120px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="#discover" aria-label="Twin City Go home">
      <svg viewBox="0 0 34 20" aria-hidden="true"><line x1="6" y1="14" x2="28" y2="6" stroke="#3D8BFF" stroke-width="3" stroke-linecap="round"/><circle cx="6" cy="14" r="5" fill="#2BD67B"/><circle cx="28" cy="6" r="5" fill="#3D8BFF"/></svg>
      <span>Twin City Go <span class="tag hide-sm">Everything around you. One place.</span></span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#discover" data-tab="discover">Discover</a>
      <a href="#transport" data-tab="transport">Transport</a>
      <a href="#saved" data-tab="saved">Saved</a>
      <a href="#admin" data-tab="admin">Admin</a>
    </nav>
    <div class="search" id="searchBox">
      <i data-lucide="search" class="s-ico"></i>
      <label class="sr" for="q">Search places</label>
      <input id="q" type="search" autocomplete="off" placeholder="What are you looking for nearby?" aria-controls="sugg" aria-autocomplete="list">
      <button class="clear" id="qClear" aria-label="Clear search"><i data-lucide="x"></i></button>
      <div class="sugg" id="sugg" role="listbox"></div>
    </div>
    <div class="wrapRel" style="margin-left:auto">
      <button class="ibtn" id="bellBtn" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell"></i><span class="dot" id="bellDot"></span></button>
      <div class="pop" id="bellPop"></div>
    </div>
    <button class="ibtn" id="themeBtn" aria-label="Switch light or dark theme"><i data-lucide="sun-moon"></i></button>
    <a class="ibtn" href="#profile" aria-label="Profile"><i data-lucide="user-round"></i></a>
  </div>
</header>

<main id="view"></main>
<footer class="f">Prototype build. Map directions open Google Maps; all other data here is local demo data stored only in this browser.</footer>

<nav class="bottom" aria-label="Main">
  <div>
    <a href="#discover" data-tab="discover"><i data-lucide="layout-grid"></i>Discover</a>
    <a href="#map" data-tab="map"><i data-lucide="map"></i>Map</a>
    <a href="#transport" data-tab="transport"><i data-lucide="bus"></i>Transport</a>
    <a href="#saved" data-tab="saved"><i data-lucide="heart"></i>Saved</a>
    <a href="#profile" data-tab="profile"><i data-lucide="user-round"></i>Profile</a>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- storage ---------- */
const store={

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const anchor=()=>ANCHORS[S.anchor]||ANCHORS.krishna;
function dist(a,b){const R=6371000,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function delta(a,b){return{dx:(b.lng-a.lng)*111320*Math.cos(a.lat*Math.PI/180),dy:(b.lat-a.lat)*111320}}
const fmtD=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(m<10000?1:0)+' km';
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hhmm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function openState(p){const h=p.hours;if(!h)return null;if(h.all)return{open:true,label:'Open 24 hours'};const o=toMin(h.o),c=toMin(h.c),n=nowMin();const open=c>o?(n>=o&&n<c):(n>=o||n<c);return open?{open:true,label:'Open until '+h.c}:{open:false,label:'Closed, opens '+h.o}}
const statusOf=p=>statusOv[p.id]||'unverified';

/* ---------- search ---------- */
const STOP=new Set(['near','nearby','me','krishna','hostel','find','a','an','the','to','for','in','shop','shops','place','places','any','around','good','best']);
function parseQ(q){
  const low=q.toLowerCase().trim();let openNow=false,s=low;
  if(/open now/.test(s)){openNow=true;s=s.replace('open now','')}
  return{openNow,tokens:s.split(/[\s,]+/).filter(t=>t&&!STOP.has(t))};
}
function hay(p){const c=CATS[p.cat];return [p.name,c.label,...c.syn,...p.tags,p.desc,p.area].join(' ').toLowerCase()}
function matchQ(p,pq){
  if(pq.openNow){const o=openState(p);if(!o||!o.open)return false}
  const h=hay(p);
  return pq.tokens.every(t=>{
    if(t==='veg'||t==='vegetarian')return p.tags.includes('Veg')||p.tags.includes('Pure veg');
    if(t==='nonveg'||t==='non-veg')return p.tags.includes('Non-veg');
    if(t==='bus'&&p.cat==='transport')return true;
    return h.includes(t);
  });
}

/* ---------- query ---------- */
function list(opts={}){
  const a=anchor();const pq=parseQ(S.q);
  let L=PLACES.filter(p=>statusOf(p)!=='inactive').map(p=>({p,d:dist(a,p)}));
  if(!opts.ignoreRadius)L=L.filter(x=>x.d<=S.radius);
  if(S.cat!=='all')L=L.filter(x=>x.p.cat===S.cat);
  if(S.sub)L=L.filter(x=>x.p.tags.includes(S.sub));
  if(S.q)L=L.filter(x=>matchQ(x.p,pq));
  if(S.sort==='updated')L.sort((x,y)=>y.p.updated.localeCompare(x.p.updated)||x.d-y.d);
  else if(S.sort==='rating')L.sort((x,y)=>(y.p.rating||0)-(x.p.rating||0)||x.d-y.d);
  else L.sort((x,y)=>x.d-y.d);
  return L;
}

/* ---------- pieces ---------- */
function radar(p,d,big){
  const a=anchor();const {dx,dy}=delta(a,p);const ang=Math.atan2(dy,dx);
  const R=big?55:50;const f=Math.min(d/Math.max(S.radius,d,1),1);const r=Math.max(f*R,6);
  const cx=110,cy=big?62:75;const x=cx+Math.cos(ang)*r,y=cy-Math.sin(ang)*r;
  const c=CATS[p.cat].color;
  return `<svg class="radar" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="${c}" stroke-opacity=".35">

/* transport */
function serves(stopId){return ROUTES.filter(r=>r.stops.includes(stopId))}
function runsToday(r){return r.days==='daily'||new Date().getDay()!==0}
function departures(stopId){
  const n=nowMin();const out=[];
  serves(stopId).forEach(r=>{
    if(!runsToday(r))return;
    const i=r.stops.indexOf(stopId);if(i===r.stops.length-1)return;
    const off=r.cum[i];let c=0;
    for(let t=toMin(r.first);t<=toMin(r.last)&&c<3;t+=r.every){const at=t+off;if(at>=n){out.push({r,at,wait:at-n});c++}}
  });
  return out.sort((x,y)=>x.at-y.at).slice(0,6);
}
function viewTransport(){
  const a=anchor();

  return `${notice()}<h1 class="pg">Buses near ${esc(a.name)}</h1>
  <div class="notice" style="border-color:var(--blue)"><i data-lucide="radio" style="color:var(--blue)"></i><div>No live bus feed is connected. Times below are <strong>scheduled departures from a demo timetable</strong>, not live arrivals. Check at the stop before you travel.</div></div>
  <div class="tgrid">
    <div>
      <h4 class="sec" style="margin-top:0">Nearest stops</h4>
      <div class="stoplist">${stops.slice(0,8).map(({p,d})=>`<button class="stop" data-stop="${p.id}" aria-pressed="${S.stop===p.id}"><span class="b"><i data-lucide="bus"></i></span><span><strong>${esc(p.name)}</strong><small>${serves(p.id).map(r=>r.code).join(', ')||'No routes in demo data'}${p.kind==='demo'?' (demo stop)':''}</small></span><span class="d">${fmtD(d)}</span></button>`).join('')}</div>
    </div>
    <div>
      ${stop?`<div class="panel">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(stop.name)}</h2><button class="btn sm" data-open="${stop.id}">Stop details</button></div>
        <h4 class="sec">Next scheduled departures</h4>
        ${deps.length?`<div class="tw"><table class="dep"><thead><tr><th>Route</th><th>Towards</th><th>Departs</th><th>Wait</th><th>Status</th></tr></thead><tbody>
          ${deps.map((x,i)=>`<tr><td><span class="rcode">${x.r.code}</span></td><td>${esc(byId[x.r.stops.at(-1)].name)}</td><td>${i===0?`<span class="big">${hhmm(x.at)}</span>`:hhmm(x.at)}</td><td>${x.wait} min</td><td><span class="badge st">Scheduled, demo</span></td></tr>`).join('')}
        </tbody></table></div>`:`<p class="nv">No more scheduled departures today from this stop${sv.some(r=>!runsToday(r))?' (some routes do not run on Sunday)':''}.</p>`}
        <h4 class="sec">Routes at this stop</h4>
        <div class="routes">${sv.map(r=>`<button class="routebtn" data-route="${r.id}" aria-pressed="${S.route===r.id}"><span class="rcode">${r.code}</span><span><strong>${esc(r.name)}</strong><br><small class="nv">Every ${r.every} min, ${r.first}–${r.last}, ${r.days==='daily'?'daily':'Mon–Sat'}</small></span></button>`).join('')||'<p class="nv">No routes in demo data.</p>'}</div>
      </div>`:''}
      ${route?routePanel(route,stop):''}
    </div>
  </div>`;
}
function routePanel(r,stop){
  const total=r.cum.at(-1);
  return `<div class="panel">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="rcode">${r.code}</span> ${esc(r.name)}</h2>

    <div class="kv">

      <div><small>Journey</small>About ${total} min</div>

}

    <div class="art hero" style="--c:${c.color}">${radar(p,d,true)}<span class="ico"><i data-lucide="${c.icon}"></i></span><span class="dist">${fmtD(d)}<small>from ${esc(anchor().name)}</small></span></div>
    <div class="inner" style="--c:${c.color}">
      <div class="badges">${kindBadge(p)}<span class="badge st">${ST_LABEL[statusOf(p)]}</span></div>
      <h2 id="sheetTitle">${esc(p.name)}</h2>
      <p class="meta">${c.label}${p.tags.length?', '+p.tags.join(', '):''}</p>
      <p>${esc(p.desc)}</p>
      <div class="actions">
        <a class="btn pri" href="${mapsDir(p)}" target="_blank" rel="noopener"><i data-lucide="navigation"></i>Get directions</a>
        <a class="btn" href="${mapsSearch(p)}" target="_blank" rel="noopener"><i data-lucide="map-pin"></i>Open in Google Maps</a>
        ${p.phone?`<a class="btn" href="tel:${esc(p.phone)}"><i data-lucide="phone"></i>Call</a>`:`<button class="btn" disabled title="No verified phone number"><i data-lucide="phone"></i>Call</button>`}
        <button class="btn" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}"><i data-lucide="heart"></i>${favs.has(p.id)?'Saved':'Save'}</button>
        <button class="btn" data-act="share" data-id="${p.id}"><i data-lucide="share-2"></i>Share</button>
        <button class="btn" data-act="report" data-id="${p.id}"><i data-lucide="flag"></i>Report incorrect info</button>
      </div>
      ${isDemo?'<p class="attr-note" style="margin-top:0;border:0;padding:0">Demo listing: Google Maps opens a nearby category search, and directions point to the demo coordinates.</p>':''}
      <div id="reportSlot"></div>
      <dl class="info">
        <dt>Address</dt><dd>${isDemo?'<span class="nv">Demo listing, no real address</span>':esc(p.area)+'<br><span class="nv">Street address not verified</span>'}</dd>
        <dt>Distance</dt><dd>${fmtD(d)} from ${esc(anchor().name)} in a straight line</dd>
        <dt>Hours</dt><dd>${o?`${p.hours.all?'24 hours':p.hours.o+' to '+p.hours.c}, <span class="openst ${o.open?'y':'n'}">${o.label}</span>${isDemo?' <span class="nv">(demo value)</span>':''}`:'<span class="nv">Not verified</span>'}</dd>
        <dt>Phone</dt><dd>${p.phone?esc(p.phone):'<span class="nv">Not available</span>'}</dd>
        <dt>Price</dt><dd>${p.price?esc(p.price)+(isDemo?' <span class="nv">(demo value)</span>':''):'<span class="nv">Not available</span>'}</dd>
        <dt>Rating</dt><dd>${p.rating?p.rating:'<span class="nv">No verified rating</span>'}</dd>
        ${attrs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
        ${sv.length?`<dt>Routes</dt><dd>${sv.map(r=>`<span class="rcode">${r.code}</span>`).join(' ')}</dd>`:''}
        ${p.cat==='transport'?`<dt>Next departures</dt><dd>${deps.length?deps.map(x=>`${x.r.code} at ${hhmm(x.at)} (${x.wait} min)`).join('<br>')+'<br><span class="nv">Scheduled, demo timetable</span>':'<span class="nv">None scheduled for the rest of today</span>'}</dd>`:''}
        <dt>Source</dt><dd>${isDemo?'Demo data written for this prototype':'Place name is real; coordinates approximate'}</dd>
        <dt>Last updated</dt><dd>${p.updated}</dd>
      </dl>
      <p class="attr-note">No photo shown. The full build loads Google Place Photos through the backend with author attribution, and falls back to this direction card when a place has none.</p>
    </div>`;
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');icons();
  setTimeout(()=>{const x=$('#sheet .x');x&&x.focus()},50);
}
function closeSheet(){
  $('#scrim').classList.remove('on');$('#sheet').classList.remove('on');
  if(location.hash.startsWith('#place-'))history.replaceState(null,'','#'+lastView);
}
function reportForm(id){
  $('#reportSlot').innerHTML=`<div class="formbox"><label>What is wrong<select id="rpType"><option>Wrong location</option><option>Wrong hours</option><option>Permanently closed</option><option>Wrong category or food type</option><option>Other</option></select></label>
  <label>Details<textarea id="rpDet" rows="3" placeholder="What you saw and when"></textarea></label>
  <div class="row"><button class="btn pri sm" data-act="submitReport" data-id="${id}">Send report</button><button class="btn sm" data-act="cancelReport">Cancel</button></div></div>`;
  $('#rpType').focus();
}

/* ---------- render + routing ---------- */
function render(){
  const h=location.hash.slice(1)||'discover';
  if(h.startsWith('place-')){const id=h.slice(6);if(byId[id]){if(!$('#view').innerHTML)rerender();detail(id);return}}
  $('#scrim').classList.remove('on');$('#sheet').classList.remove('on');
  if(h==='map'){S.mode='map';renderView('discover','map')}
  else{if(h==='discover'&&renderView.prev==='map')S.mode='feed';renderView(['discover','transport','saved','profile','admin'].includes(h)?h:'discover')}
}
function renderView(v,tab){
  lastView=tab||v;renderView.prev=lastView;
  const fn={discover:viewDiscover,transport:viewTransport,saved:viewSaved,profile:viewProfile,admin:viewAdmin}[v];
  $('#view').innerHTML=fn();
  const cur=(v==='discover'&&S.mode==='map')?'map':v;
  document.querySelectorAll('[data-tab]').forEach(a=>{const on=a.dataset.tab===cur||(cur==='map'&&a.dataset.tab==='discover'&&a.closest('.tabs'));if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  bell();icons();
}
function rerender(){renderView(lastView==='map'?'discover':lastView,lastView==='map'?'map':undefined)}

function bell(){
  const pend=queue.filter(q=>q.state==='Pending verification').length;
  $('#bellPop').innerHTML=`<p><strong>Bus times</strong> are from a demo timetable. Live tracking needs a verified operator feed.</p><p>${pend?`${pend} submission${pend>1?'s':''} waiting for verification. <a href="#admin">Review</a>`:'No submissions waiting for verification.'}</p><p>${favs.size} saved place${favs.size===1?'':'s'}.</p>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-open],[data-mk],article');if(!t)return;
  const ds=t.dataset;
  if(ds.fav){e.stopPropagation();const id=ds.fav;favs.has(id)?favs.delete(id):favs.add(id);saveAll();toast(favs.has(id)?'Saved':'Removed from saved');if($('#sheet').classList.contains('on'))detail(id);rerender();return}
  if(ds.open){e.preventDefault();location.hash='place-'+ds.open;return}
  if(ds.mk){S.sel=ds.mk;rerender();return}
  if(ds.cat){S.cat=ds.cat;S.sub=null;S.sel=null;rerender();return}
  if(ds.sub!==undefined){S.sub=ds.sub||null;rerender();return}
  if(ds.mode){S.mode=ds.mode;history.replaceState(null,'','#'+(ds.mode==='map'?'map':'discover'));rerender();return}
  if(ds.stop){S.stop=ds.stop;S.route=null;rerender();return}
  if(ds.route){S.route=S.route===ds.route?null:ds.route;rerender();return}
  if(ds.goroute){const r=ROUTES.find(x=>x.id===ds.goroute);S.stop=r.stops[0];S.route=r.id;location.hash='transport';return}
  if(ds.favroute){const id=ds.favroute;favRoutes.has(id)?favRoutes.delete(id):favRoutes.add(id);saveAll();toast(favRoutes.has(id)?'Route saved':'Route removed');rerender();return}
  if(ds.approve||ds.reject){const x=queue.find(q=>q.id===(ds.approve||ds.reject));x.state=ds.approve?'Approved':'Rejected';if(x.placeId&&statusOv[x.placeId]==='reported'){statusOv[x.placeId]=ds.approve?'pending':'unverified'}saveAll();toast(ds.approve?'Approved':'Rejected');rerender();return}
  switch(ds.act){
    case 'close':closeSheet();break;
    case 'hideNotice':noticeOff=true;store.set('noticeOff',true);rerender();break;
    case 'clearQ':setQ('');break;
    case 'widen':S.radius=+ds.r;saveAll();rerender();break;
    case 'resetFilters':S.cat='all';S.sub=null;setQ('');break;
    case 'zoomIn':S.zoom=Math.min(S.zoom*1.5,8);rerender();break;
    case 'zoomOut':S.zoom=Math.max(S.zoom/1.5,.5);rerender();break;
    case 'zoomReset':S.zoom=1;rerender();break;
    case 'suggest':S.suggestOpen=true;closeSheet();if(!['discover','profile'].includes(lastView))location.hash='discover';else rerender();setTimeout(()=>{const b=$('#suggestBox');b&&b.scrollIntoView({behavior:'smooth',block:'center'});$('#sgName')&&$('#sgName').focus()},60);break;
    case 'cancelSuggest':S.suggestOpen=false;rerender();break;
    case 'submitSuggest':{const n=$('#sgName').value.trim();if(!n){toast('Add a name first');$('#sgName').focus();break}
      queue.unshift({id:'q'+Date.now(),type:$('#sgType').value,subject:n,details:$('#sgDet').value.trim(),state:'Pending verification',by:'you',at:new Date().toISOString()});S.suggestOpen=false;saveAll();toast('Sent for verification');rerender();break}
    case 'report':reportForm(ds.id);break;
    case 'cancelReport':$('#reportSlot').innerHTML='';break;
    case 'submitReport':{const p=byId[ds.id];queue.unshift({id:'q'+Date.now(),placeId:p.id,type:'Report: '+$('#rpType').value,subject:p.name,details:$('#rpDet').value.trim(),state:'Pending verification',by:'you',at:new Date().toISOString()});statusOv[p.id]='reported';saveAll();toast('Report sent for verification');detail(p.id);rerender();break}
    case 'share':{const p=byId[ds.id];const url=location.href.split('#')[0]+'#place-'+p.id;
      (async()=>{try{if(navigator.share){await navigator.share({title:p.name,text:p.name+' on Twin City Go',url});return}}catch(err){if(err&&err.name==='AbortError')return}
        try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(err){toast('Copy this link: '+url)}})();break}
    case 'saveProfile':profile.name=$('#pfName').value.trim();profile.college=$('#pfCollege').value.trim();S.anchor=$('#pfHostel').value;S.radius=+$('#pfRadius').value;saveAll();toast('Profile saved');rerender();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-open],g[data-mk]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='radiusSel'){S.radius=+t.value;S.zoom=1;saveAll();rerender()}
  else if(t.id==='sortSel'){S.sort=t.value;rerender()}
  else if(t.id==='anchorSel'){setAnchor(t.value)}
  else if(t.id==='admSt'){S.adminSt=t.value;rerender()}
  else if(t.dataset.setst){const v=t.value;if(v==='unverified')delete statusOv[t.dataset.setst];else statusOv[t.dataset.setst]=v;saveAll();toast('Status set to '+ST_LABEL[v])}
});
document.addEventListener('input',e=>{
  if(e.target.id==='admQ'){S.adminQ=e.target.value;clearTimeout(admT);admT=setTimeout(()=>{rerender();const i=$('#admQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)}
});
let admT;

function setAnchor(v){
  if(v!=='custom'){S.anchor=v;S.sel=null;S.stop=null;S.route=null;rerender();return}
  if(!navigator.geolocation){toast('Location is not available here. Pick a hostel instead.');rerender();return}
  toast('Finding your location…');
  try{navigator.geolocation.getCurrentPosition(pos=>{ANCHORS.custom={id:'custom',name:'Your location',area:'',lat:pos.coords.latitude,lng:pos.coords.longitude,verified:true};S.anchor='custom';S.sel=null;S.stop=null;rerender();toast('Using your location')},
    ()=>{toast('Location access was blocked. Pick a hostel instead.');rerender()},{timeout:10000,maximumAge:60000})}catch(err){toast('Location access was blocked. Pick a hostel instead.');rerender()}
}

/* search box */
const qEl=$('#q'),sugg=$('#sugg');let qT,hl=-1;
function setQ(v){S.q=v;qEl.value=v;$('#searchBox').classList.toggle('has',!!v);sugg.classList.remove('on');if(lastView!=='discover'&&lastView!=='map')location.hash='discover';else rerender()}
qEl.addEventListener('input',()=>{
  $('#searchBox').classList.toggle('has',!!qEl.value);
  clearTimeout(qT);qT=setTimeout(()=>{
    const v=qEl.value.trim();hl=-1;if(!v){sugg.classList.remove('on');if(S.q){S.q='';rerender()}return}
    const pq=parseQ(v);const a=anchor();
    const cats=Object.entries(CATS).filter(([k,c])=>pq.tokens.some(t=>c.syn.some(s=>s.startsWith(t))||c.label.toLowerCase().startsWith(t))).slice(0,3);
    const ps=PLACES.filter(p=>statusOf(p)!=='inactive'&&matchQ(p,pq)).map(p=>({p,d:dist(a,p)})).sort((x,y)=>x.d-y.d).slice(0,6);
    sugg.innerHTML=`<button role="option" data-sq="${esc(v)}"><i data-lucide="search"></i>Search “${esc(v)}”<small>${ps.length} match${ps.length===1?'':'es'}</small></button>`+
      cats.map(([k,c])=>`<button role="option" data-scat="${k}"><i data-lucide="${c.icon}"></i>All ${c.label.toLowerCase()}<small>category</small></button>`).join('')+
      ps.map(({p,d})=>`<button role="option" data-sopen="${p.id}"><i data-lucide="${CATS[p.cat].icon}"></i>${esc(p.name)}<small>${fmtD(d)}</small></button>`).join('');
    sugg.classList.add('on');icons();
  },200);
});
qEl.addEventListener('keydown',e=>{
  const items=[...sugg.querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!items.length)return;e.preventDefault();hl=(hl+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('hl',i===hl))}
  else if(e.key==='Enter'){e.preventDefault();if(hl>=0&&items[hl])items[hl].click();else setQ(qEl.value.trim())}
  else if(e.key==='Escape'){sugg.classList.remove('on')}
});
sugg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;e.stopPropagation();
  if(b.dataset.sq!==undefined)setQ(b.dataset.sq);
  else if(b.dataset.scat){S.cat=b.dataset.scat;S.sub=null;setQ('')}
  else if(b.dataset.sopen){sugg.classList.remove('on');location.hash='place-'+b.dataset.sopen}
});
$('#qClear').addEventListener('click',()=>setQ(''));
document.addEventListener('click',e=>{if(!e.target.closest('#searchBox'))sugg.classList.remove('on');if(!e.target.closest('#bellBtn,#bellPop')){$('#bellPop').classList.remove('on');$('#bellBtn').setAttribute('aria-expanded','false')}});
$('#bellBtn').addEventListener('click',()=>{const on=$('#bellPop').classList.toggle('on');$('#bellBtn').setAttribute('aria-expanded',on);$('#bellDot').style.display='none'});
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx);
});

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
